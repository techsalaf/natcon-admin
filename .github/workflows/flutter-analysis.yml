name: Flutter analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - natcon-user-app
          - natcon-organizer-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: ${{ runner.os }}-flutter-${{ matrix.project }}-${{ hashFiles(format('{0}/pubspec.lock', matrix.project)) }}
      - name: Resolve dependencies
        working-directory: ${{ matrix.project }}
        run: flutter pub get
      - name: Analyze Dart sources
        working-directory: ${{ matrix.project }}
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
