name: Flutter analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate shared NATCON mobile API contract
        working-directory: services/mobile
        run: |
          node evals/staff-token.cjs
          node evals/mobile-router.cjs
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - natcon-user-app
          - natcon-organizer-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: ${{ runner.os }}-flutter-${{ matrix.project }}-${{ hashFiles(format('{0}/pubspec.lock', matrix.project)) }}
      - name: Resolve dependencies
        working-directory: ${{ matrix.project }}
        run: flutter pub get
      - name: Analyze Dart sources
        working-directory: ${{ matrix.project }}
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test app entrypoint regression
        working-directory: ${{ matrix.project }}
        run: flutter test
      - name: Evaluate app entrypoint contract
        working-directory: ${{ matrix.project }}
        run: node evals/entrypoint.cjs
